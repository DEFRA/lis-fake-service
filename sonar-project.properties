sonar.projectKey=DEFRA_lis-fake-service
sonar.organization=defra
sonar.qualitygate.ignoreSmallChanges=false

sonar.links.homepage=https://github.com/DEFRA/lis-fake-service
sonar.links.ci=https://github.com/DEFRA/lis-fake-service/actions
sonar.links.scm=https://github.com/DEFRA/lis-fake-service
sonar.links.issue=https://github.com/DEFRA/lis-fake-service/issues

sonar.sources=src
sonar.tests=src

sonar.exclusions=\
  src/**/*.test.js,\
  src/**/*.spec.js,\
  src/**/*.test.ts,\
  src/**/*.spec.ts,\
  src/**/*.test.jsx,\
  src/**/*.spec.jsx,\
  src/**/*.test.tsx,\
  src/**/*.spec.tsx

sonar.test.inclusions=\
  src/**/*.test.js,\
  src/**/*.spec.js,\
  src/**/*.test.ts,\
  src/**/*.spec.ts,\
  src/**/*.test.jsx,\
  src/**/*.spec.jsx,\
  src/**/*.test.tsx,\
  src/**/*.spec.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
